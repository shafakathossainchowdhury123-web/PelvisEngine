name: Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item build/Release/PelvisEngine.exe package/PelvisEngine.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PelvisEngine-Windows-x64
          path: package/PelvisEngine.exe
